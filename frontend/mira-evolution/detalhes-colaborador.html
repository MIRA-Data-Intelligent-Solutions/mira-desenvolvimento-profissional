<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Mira Evolution — transforme dados em direção." />
    <title>Detalhes do colaborador — Mira Evolution</title>

    <!-- Aplica o tema salvo antes de desenhar a tela (evita "piscar") -->
    <script src="./js/comum/tema.js"></script>

    <!-- Fontes do Figma: Inter (conteúdo) e Geist (menu lateral). Se não carregarem, usa a fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@200;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/themes.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#page-root">Pular para o conteúdo</a>
    <div class="app">
      <!-- Menu lateral e barra do topo: preenchidos por js/comum/layout.js -->
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
      <header class="topbar"></header>
      <div class="scrim" data-action="close-menu"></div>

      <main class="main" id="main">
        <div id="page-root" tabindex="-1">
          <div class="page detail" style="--page-gap:24px">
            <div class="detail__top">
              <!-- Gestor: link "Voltar". Colaborador: título "Meu progresso" (o JavaScript escolhe) -->
              <div id="topo-detalhe" style="display:contents"></div>
              <div class="page-header__actions">
                <label class="select select--sm"><span class="sr-only">Período</span>
                  <select id="filtro-dias">
                    <option value="7">Últimos 7 dias</option>
                    <option value="15">Últimos 15 dias</option>
                    <option value="30" selected>Últimos 30 dias</option>
                  </select><i data-icone="chevron-down" data-tamanho="12"></i></label>
                <div class="header-tools" data-tools></div>
              </div>
            </div>

            <section class="card profile-summary" id="resumo" aria-label="Resumo do colaborador"></section>

            <section class="grid grid--4" id="kpis" style="--grid-gap:32px" aria-label="Indicadores">
              <div class="skeleton" style="height:137px"></div><div class="skeleton" style="height:137px"></div>
              <div class="skeleton" style="height:137px"></div><div class="skeleton" style="height:137px"></div>
            </section>

            <div class="detail__row detail__row--charts">
              <section class="card card__pad" aria-labelledby="freq-title">
                <h2 class="card__title card__title--lg" id="freq-title">Evolução de frequência</h2>
                <div class="detail__plot" id="grafico-frequencia"></div>
              </section>
              <section class="card detail__courses" aria-labelledby="recent-title">
                <div class="card__pad">
                  <h2 class="card__title card__title--lg" id="recent-title">Cursos Recentes</h2>
                  <div id="cursos-recentes"></div>
                </div>
                <a class="card__footer" id="link-cursos" href="#">Ver Cursos <i data-icone="arrow-right" data-tamanho="13"></i></a>
              </section>
            </div>

            <!--Comentário Rafael: Ativar Futuramente (Section abaixo) -->
            
            <div class="detail__row detail__row--bottom">
              <!-- <section class="card card__pad" aria-labelledby="cert-title">
                <h2 class="card__title card__title--lg" id="cert-title">Certificados Obtidos</h2>
                <div id="certificados"></div>
              </section> -->
              <section class="card card__pad" aria-labelledby="skills-title">
                <h2 class="card__title card__title--lg" id="skills-title">Competências Desenvolvidas</h2>
                <div id="competencias" style="margin-top:20px"></div>
              </section>
            </div>
          </div>
        </div>
      </main>
    </div>
    <noscript>Esta aplicação precisa de JavaScript habilitado.</noscript>

    <script src="./js/lib/jquery-3.6.1.min.js"></script>
    <script src="./js/comum/config.js"></script>
    <script src="./js/comum/ferramentas.js"></script>
    <script src="./js/comum/icones.js"></script>
    <script src="./js/comum/ui.js"></script>
    <script src="./js/comum/widgets.js"></script>
    <script src="./js/comum/grafico.js"></script>
    <script src="./js/comum/dados.js"></script>
    <script src="./js/comum/sessao.js"></script>
    <script src="./js/comum/layout.js"></script>
    <script src="./js/paginas/detalhes-colaborador.js"></script>
  </body>
</html>
