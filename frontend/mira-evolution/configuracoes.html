<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Mira Evolution — transforme dados em direção." />
    <title>Configurações — Mira Evolution</title>

    <!-- Aplica o tema salvo antes de desenhar a tela (evita "piscar") -->
    <script src="./js/comum/tema.js"></script>

    <!-- Fontes do Figma: Inter (conteúdo) e Geist (menu lateral). Se não carregarem, usa a fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@200;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/themes.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#page-root">Pular para o conteúdo</a>
    <div class="app">
      <!-- Menu lateral e barra do topo: preenchidos por js/comum/layout.js -->
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
      <header class="topbar"></header>
      <div class="scrim" data-action="close-menu"></div>

      <main class="main" id="main">
        <div id="page-root" tabindex="-1">
          <div class="page settings" style="--page-gap:24px">
            <header class="page-header">
              <div class="page-header__titles">
                <h1 class="page-title">Configurações</h1>
                <p class="page-subtitle">Gerencie preferências da empresa, aparência, integrações e segurança.</p>
              </div>
              <div class="page-header__actions">
                <!-- data-sem-tema: nesta página o tema é trocado em "Aparência", então só mostra as notificações -->
                <div class="header-tools" data-tools data-sem-tema></div>
              </div>
            </header>

            <form class="settings__form" id="form-config" novalidate>
              <section class="card card__pad settings__section" aria-labelledby="geral-title">
                <h2 class="card__title card__title--lg" id="geral-title">Geral</h2>
                <div class="settings__grid">
                  <label class="field"><span class="field__label">Nome da empresa</span><input class="input" name="companyName"></label>
                  <label class="field"><span class="field__label">CNPJ</span><input class="input" name="cnpj" inputmode="numeric"></label>
                  <label class="field"><span class="field__label">Formato de data</span><span class="select select--field"><select name="dateFormat"></select><i data-icone="chevron-down" data-tamanho="14"></i></span></label>
                </div>
              </section>

              <section class="card card__pad settings__section" aria-labelledby="apar-title">
                <h2 class="card__title card__title--lg" id="apar-title">Aparência</h2>
                <div class="theme-cards" role="radiogroup" aria-label="Tema">
                  <button type="button" role="radio" class="theme-card theme-card--light" data-tema="light" aria-checked="false"><i data-icone="sun" data-tamanho="22"></i><span>Claro</span></button>
                  <button type="button" role="radio" class="theme-card theme-card--dark" data-tema="dark" aria-checked="false"><i data-icone="moon" data-tamanho="22"></i><span>Escuro</span></button>
                </div>
              </section>
              
              <!--Comentário Rafael: Ativar Futuramente!-->

              <!-- <section class="card card__pad settings__section" aria-labelledby="integ-title">
                <h2 class="card__title card__title--lg" id="integ-title">Integrações</h2>
                <ul class="integration-list" id="lista-integracoes"></ul>
              </section> -->

              <section class="card card__pad settings__section" aria-labelledby="seg-title">
                <h2 class="card__title card__title--lg" id="seg-title">Segurança</h2>
                <div class="settings__grid">
                  <label class="field"><span class="field__label">Renovação de senha</span><span class="select select--field"><select name="renewal"></select><i data-icone="chevron-down" data-tamanho="14"></i></span>
                    <span class="field__hint" id="ultima-renovacao"></span></label>
                  <div class="field"><span class="field__label" id="2fa-label">Autenticação em dois fatores (2FA)</span>
                    <div class="switch-row"><button type="button" role="switch" class="switch" id="twoFactor" aria-checked="false" aria-labelledby="2fa-label"></button><span id="texto-2fa">Desativada</span></div></div>
                </div>
              </section>

              <div class="save-bar"><button type="button" class="btn btn--outline" id="btn-descartar">Descartar alterações</button><button type="submit" class="btn btn--primary">Salvar alterações</button></div>
            </form>
          </div>
        </div>
      </main>
    </div>
    <noscript>Esta aplicação precisa de JavaScript habilitado.</noscript>

    <script src="./js/lib/jquery-3.6.1.min.js"></script>
    <script src="./js/comum/config.js"></script>
    <script src="./js/comum/ferramentas.js"></script>
    <script src="./js/comum/icones.js"></script>
    <script src="./js/comum/ui.js"></script>
    <script src="./js/comum/widgets.js"></script>
    <script src="./js/comum/dados.js"></script>
    <script src="./js/comum/sessao.js"></script>
    <script src="./js/comum/layout.js"></script>
    <script src="./js/paginas/configuracoes.js"></script>
  </body>
</html>
