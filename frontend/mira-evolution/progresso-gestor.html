<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="Mira Evolution — transforme dados em direção." />
    <title>Progresso — Mira Evolution</title>

    <!-- Aplica o tema salvo antes de desenhar a tela (evita "piscar") -->
    <script src="./js/comum/tema.js"></script>

    <!-- Fontes do Figma: Inter (conteúdo) e Geist (menu lateral). Se não carregarem, usa a fonte do sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Inter:wght@200;400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/themes.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/pages.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#page-root">Pular para o conteúdo</a>
    <div class="app">
      <!-- Menu lateral e barra do topo: preenchidos por js/comum/layout.js -->
      <aside class="sidebar" id="sidebar" aria-label="Navegação principal"></aside>
      <header class="topbar"></header>
      <div class="scrim" data-action="close-menu"></div>

      <main class="main" id="main">
        <div id="page-root" tabindex="-1">
          <div class="page" style="--page-gap:24px">
            <header class="page-header">
              <div class="page-header__titles">
                <h1 class="page-title">Progresso</h1>
                <p class="page-subtitle">Evolução do desenvolvimento por setor e ranking de colaboradores.</p>
              </div>
              <div class="page-header__actions">
                <label class="select"><span class="sr-only">Setor</span>
                  <select id="filtro-setor"><option value="todos">Setor: Todos</option></select><i data-icone="chevron-down" data-tamanho="12"></i></label>
                <button type="button" class="filter-btn" id="botao-periodo" data-action="date-range" aria-haspopup="dialog" aria-expanded="false"><i data-icone="calendar" data-tamanho="16"></i><span data-range-label></span><i data-icone="chevron-down" data-tamanho="14"></i></button>
                <div class="header-tools" data-tools></div>
              </div>
            </header>

            <section class="grid grid--4" id="kpis" style="--grid-gap:16px" aria-label="Indicadores de progresso">
              <div class="skeleton" style="height:137px"></div><div class="skeleton" style="height:137px"></div>
              <div class="skeleton" style="height:137px"></div><div class="skeleton" style="height:137px"></div>
            </section>

            <section class="card card__pad" aria-labelledby="evo-title">
              <div class="chart-head"><h2 class="card__title card__title--lg" id="evo-title">Evolução do desenvolvimento</h2><span id="legenda" style="display:contents"></span></div>
              <div class="dash-chart__plot" id="grafico-progresso"></div>
            </section>

            <section class="card" aria-labelledby="rank-title">
              <div class="card__pad card__pad--head"><h2 class="card__title card__title--lg" id="rank-title">Ranking de colaboradores</h2></div>
              <div id="ranking"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <noscript>Esta aplicação precisa de JavaScript habilitado.</noscript>

    <script src="./js/lib/jquery-3.6.1.min.js"></script>
    <script src="./js/comum/config.js"></script>
    <script src="./js/comum/ferramentas.js"></script>
    <script src="./js/comum/icones.js"></script>
    <script src="./js/comum/ui.js"></script>
    <script src="./js/comum/widgets.js"></script>
    <script src="./js/comum/grafico.js"></script>
    <script src="./js/comum/dados.js"></script>
    <script src="./js/comum/sessao.js"></script>
    <script src="./js/comum/layout.js"></script>
    <script src="./js/paginas/progresso-gestor.js"></script>
  </body>
</html>
